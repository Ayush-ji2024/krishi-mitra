name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          # CPU-only PyTorch first: the default Linux wheel pulls in ~2 GB of CUDA.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Check that all Python files compile
        run: python -m compileall -q backend scripts

      # The trained models are not in git, so the API tests skip themselves here;
      # the ranking-maths and (mocked) weather tests run in full.
      - name: Run tests
        run: python -m pytest backend/tests -v -rs

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
